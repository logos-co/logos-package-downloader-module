name: "The Package Downloader starts its Storage Node using default configuration."
output: package-downloader-default-node.md
release: ""

intro: |
  The package downloader needs a storage node running before it can serve a
  `logos:<network>:<cid>` url, and it brings that node up itself when the storage module
  becomes available. This tutorial proves it on the default configuration, kept off the
  public network: the node gets no bootstrap nodes, and everything else, the data
  directory included, comes from the defaults.

what_you_build: "A Logos daemon whose storage node was never started by hand."

what_you_learn:
  - How the downloader starts the storage node when the storage module loads
  - Where the node configuration is read from, and how the defaults fill in the rest
prerequisites:
  - |
    **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:

    ```bash
    mkdir -p ~/.config/nix
    echo 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf
    ```

    Verify: `nix flake --help >/dev/null 2>&1 && echo "Flakes enabled"`
  - "**A Linux or macOS machine.**"
  - "**`jq`** on your `PATH`. Verify: `jq --version`"

sections:
  - title: "Set up a Logos daemon"
    step: true
    text: |
      `logosctl` is both the Logos daemon and its client; `lgpm` installs
      `.lgx` packages into a modules directory.
    steps:
      - title: "Build logosctl"
        text: |
          logosctl is built with the package downloader under test.
        run: "nix build 'github:logos-co/logos-logoscore-cli#ctl' --override-input logos-package-downloader-module 'github:logos-co/logos-package-downloader-module{release}' --out-link ./logosctl"
        code_block: "nix build 'github:logos-co/logos-logoscore-cli#ctl' --out-link ./logosctl"
        check_file: "logosctl/bin/logosctl"

      - title: "Build lgpm"
        run: "nix build 'github:logos-co/logos-package-manager#cli' -o lgpm"
        code_block: "nix build 'github:logos-co/logos-package-manager#cli' -o lgpm"
        check_file: "lgpm/bin/lgpm"

      - title: "Build and install the storage module"
        run: |
          set -eu
          STORAGE_REV=$(nix flake metadata --json 'github:logos-co/logos-package-downloader-module{release}' \
            | jq -r '.locks.nodes[.locks.nodes.root.inputs.storage_module].locked.rev')
          nix build "github:logos-co/logos-storage-module/$STORAGE_REV#lgx" -o storage-lgx
          ./lgpm/bin/lgpm --modules-dir ./session/modules --allow-unsigned install --file storage-lgx/*.lgx
          ./lgpm/bin/lgpm --modules-dir ./session/modules list
        code_block: |
          nix build 'github:logos-co/logos-storage-module#lgx' -o storage-lgx
          lgpm --modules-dir ./session/modules --allow-unsigned install --file storage-lgx/*.lgx
          lgpm --modules-dir ./session/modules list
        expect_contains:
          - "storage_module"

      - title: "Keep the node off the public network"
        text: |
          The storage module reads the node configuration from
          `$HOME/.logos_storage/config.json`, and `HOME` points at an empty
          directory here. With no configuration, the node would join the public
          `logos.test` network, and its start would wait on that network's
          bootstrap nodes for a minute or more.

          This configuration gives the node no bootstrap nodes and a loopback
          address, and sets nothing else.
        run: |
          set -eu
          mkdir -p home/.logos_storage
          cat > home/.logos_storage/config.json <<'EOF'
          {
              "no-bootstrap-node": true,
              "listen-ip": "127.0.0.1",
              "nat": "extip:127.0.0.1"
          }
          EOF
          cat home/.logos_storage/config.json
        code_block: |
          mkdir -p home/.logos_storage
          cat > home/.logos_storage/config.json <<'EOF'
          {
              "no-bootstrap-node": true,
              "listen-ip": "127.0.0.1",
              "nat": "extip:127.0.0.1"
          }
          EOF
        expect_contains:
          - '"no-bootstrap-node": true'

      - title: "Start the daemon"
        run: 'HOME="$(pwd)/home" ./logosctl/bin/logosctl --config-dir ./session -D --detach'
        code_block: "HOME=$(pwd)/home logosctl --config-dir ./session -D --detach"

  - title: "The node is up, and nobody started it"
    step: true
    steps:
      - title: "The node is running"
        text: |
          The daemon loads the storage module at start,
          and the downloader then loads the configuration, initialises the node
          and starts it.
        run: |
          set -eu

          # The node takes a moment to start
          for _ in $(seq 30); do
            running=$(./logosctl/bin/logosctl --config-dir ./session call storage_module isRunning)
            case "$running" in *'"result":true'*) break ;; esac
            sleep 1
          done

          echo "$running"

          # Not running: show what the node was doing instead
          case "$running" in
            *'"result":true'*) ;;
            *) grep storage_module session/logs/daemon.log | tail -n 40; exit 1 ;;
          esac
        code_block: 'logosctl call storage_module isRunning'
        expect_contains:
          - '"result":true'

      - title: "It runs on the default data directory"
        text: |
          The configuration sets no data directory, so `loadConfigOrDefault` fills in the
          default one, under the shared storage home.
        run: './logosctl/bin/logosctl --config-dir ./session call storage_module dataDir'
        code_block: 'logosctl call storage_module dataDir'
        expect_contains:
          - ".logos_storage/data"

      - title: "The repository exists on disk"
        run: 'ls -d home/.logos_storage/data'
        code_block: 'ls -d home/.logos_storage/data'
        expect_contains:
          - ".logos_storage/data"

  - title: "The node outlives the downloader"
    step: true
    text: |
      The node is shared, so nobody takes it down behind another consumer's
      back. The downloader leaves without stopping anything, and the node stays
      up for whoever else is using it.
    steps:
      - title: "Unload the downloader"
        run: |
          set -eu
          ./logosctl/bin/logosctl --config-dir ./session module unload package_downloader
          sleep 3
          ./logosctl/bin/logosctl --config-dir ./session call storage_module isRunning
        code_block: |
          logosctl module unload package_downloader
          logosctl call storage_module isRunning
        expect_contains:
          - "true"

  - title: "Shut down"
    step: true
    steps:
      - title: "Stop the daemon"
        run: './logosctl/bin/logosctl --config-dir ./session stop'
        code_block: "logosctl stop"

  - title: "Shut down while the node starts"
    step: true
    text: |
      Starting the daemon starts the node. Stopping the daemon right away,
      while the node may still be starting, must still end cleanly: the daemon
      exits, and nothing crashes.
    steps:
      - title: "Start the daemon and stop it at once"
        run: |
          set -eu

          HOME="$(pwd)/home" ./logosctl/bin/logosctl --config-dir ./session -D --detach
          # Not a terminal: status prints JSON.
          pid=$(./logosctl/bin/logosctl --config-dir ./session status | jq -r '.daemon.pid // empty')
          if [ -z "$pid" ]; then
            echo "no daemon pid"
            exit 1
          fi

          ./logosctl/bin/logosctl --config-dir ./session stop

          for _ in $(seq 100); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.1
          done

          if kill -0 "$pid" 2>/dev/null; then
            echo "the daemon is still running"
            exit 1
          fi

          # A module host that crashes prints `FATAL: module '<name>' crashed`.
          if grep -E "FATAL: module|terminate called|libc\+\+abi|Segmentation fault|SIGSEGV|SIGABRT" session/logs/daemon.log; then
            exit 1
          fi

          echo "stopped cleanly"
        code_block: |
          HOME=$(pwd)/home logosctl --config-dir ./session -D --detach
          logosctl stop
        expect_contains:
          - "stopped cleanly"
