name: "The Package Downloader leaves its Storage Node off until a download needs it."
output: package-downloader-default-node.md
release: ""

intro: |
  The package downloader needs a storage node running before it can serve a
  `logos:<network>:<cid>` url, and it brings that node up itself, for the first
  download that needs it. Until then the node stays off: a daemon that never
  downloads over Logos Storage writes nothing under `$HOME/.logos_storage`. This
  tutorial proves it on the default configuration, kept off the public network.
  The storage download tutorial shows a download starting the node.

what_you_build: "A Logos daemon whose package downloader runs while its storage node stays off."

what_you_learn:
  - That starting the downloader does not start the storage node
  - How the downloader reports a node that waits for a download
prerequisites:
  - |
    **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:

    ```bash
    mkdir -p ~/.config/nix
    echo 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf
    ```

    Verify: `nix flake --help >/dev/null 2>&1 && echo "Flakes enabled"`
  - "**A Linux or macOS machine.**"
  - "**`jq`** on your `PATH`. Verify: `jq --version`"

sections:
  - title: "Set up a Logos daemon"
    step: true
    text: |
      `logosctl` is both the Logos daemon and its client; `lgpm` installs
      `.lgx` packages into a modules directory.
    steps:
      - title: "Build logosctl"
        text: |
          logosctl is built with the package downloader under test.
        run: "nix build 'github:logos-co/logos-logoscore-cli#ctl' --override-input logos-package-downloader-module 'github:logos-co/logos-package-downloader-module{release}' --out-link ./logosctl"
        code_block: "nix build 'github:logos-co/logos-logoscore-cli#ctl' --out-link ./logosctl"
        check_file: "logosctl/bin/logosctl"

      - title: "Build lgpm"
        run: "nix build 'github:logos-co/logos-package-manager#cli' -o lgpm"
        code_block: "nix build 'github:logos-co/logos-package-manager#cli' -o lgpm"
        check_file: "lgpm/bin/lgpm"

      - title: "Build and install the storage module"
        run: |
          set -eu
          STORAGE_REV=$(nix flake metadata --json 'github:logos-co/logos-package-downloader-module{release}' \
            | jq -r '.locks.nodes[.locks.nodes.root.inputs.storage_module].locked.rev')
          nix build "github:logos-co/logos-storage-module/$STORAGE_REV#lgx" -o storage-lgx
          ./lgpm/bin/lgpm --modules-dir ./session/modules --allow-unsigned install --file storage-lgx/*.lgx
          ./lgpm/bin/lgpm --modules-dir ./session/modules list
        code_block: |
          nix build 'github:logos-co/logos-storage-module#lgx' -o storage-lgx
          lgpm --modules-dir ./session/modules --allow-unsigned install --file storage-lgx/*.lgx
          lgpm --modules-dir ./session/modules list
        expect_contains:
          - "storage_module"

      - title: "Keep the node off the public network"
        text: |
          The storage module reads the node configuration from
          `$HOME/.logos_storage/config.json`, and `HOME` points at an empty
          directory here. With no configuration, the node would join the public
          `logos.test` network, and its start would wait on that network's
          bootstrap nodes for a minute or more.

          This configuration gives the node no bootstrap nodes and a loopback
          address, and sets nothing else.
        run: |
          set -eu
          mkdir -p home/.logos_storage
          cat > home/.logos_storage/config.json <<'EOF'
          {
              "no-bootstrap-node": true,
              "listen-ip": "127.0.0.1",
              "nat": "extip:127.0.0.1"
          }
          EOF
          cat home/.logos_storage/config.json
        code_block: |
          mkdir -p home/.logos_storage
          cat > home/.logos_storage/config.json <<'EOF'
          {
              "no-bootstrap-node": true,
              "listen-ip": "127.0.0.1",
              "nat": "extip:127.0.0.1"
          }
          EOF
        expect_contains:
          - '"no-bootstrap-node": true'

      - title: "Start the daemon"
        run: 'HOME="$(pwd)/home" ./logosctl/bin/logosctl --config-dir ./session -D --detach'
        code_block: "HOME=$(pwd)/home logosctl --config-dir ./session -D --detach"

  - title: "Starting the downloader leaves the node off"
    step: true
    steps:
      - title: "The daemon starts the downloader"
        text: |
          The daemon loads the storage module and the downloader at start, and
          starts the downloader as soon as it loads it, as Basecamp does.
        run: './logosctl/bin/logosctl --config-dir ./session call package_downloader getState'
        code_block: 'logosctl call package_downloader getState'
        expect_contains:
          - '"result":"running"'

      - title: "Starting it again changes nothing"
        text: |
          `start()` is idempotent, so a consumer that needs the downloader, after
          a reload for instance, can call it without checking first.
        run: './logosctl/bin/logosctl --config-dir ./session call package_downloader start'
        code_block: 'logosctl call package_downloader start'
        expect_contains:
          - '"success":true'

      - title: "The node waits for a download"
        text: |
          The downloader sees the storage module become ready, finds its node
          not running and leaves it so: `idle` means the first download from a
          `logos:` url starts it.
        run: |
          set -eu

          # The downloader reports the node once the storage module is ready
          for _ in $(seq 30); do
            state=$(./logosctl/bin/logosctl --config-dir ./session call package_downloader getStorageState)
            case "$state" in *'"idle"'*) break ;; esac
            sleep 1
          done

          echo "$state"
          ./logosctl/bin/logosctl --config-dir ./session call storage_module isRunning
        code_block: |
          logosctl call package_downloader getStorageState
          logosctl call storage_module isRunning
        expect_contains:
          - '"state":"idle"'
          - '"result":false'

      - title: "Nothing was written to the storage home"
        text: |
          The node never started, so it created no data directory.
        run: 'test ! -e home/.logos_storage/data && echo "no data directory"'
        code_block: 'ls home/.logos_storage'
        expect_contains:
          - "no data directory"

  - title: "Shut down"
    step: true
    steps:
      - title: "Stop the daemon"
        run: './logosctl/bin/logosctl --config-dir ./session stop'
        code_block: "logosctl stop"

  - title: "Shut down while the downloader starts"
    step: true
    text: |
      Stopping the daemon right after it started the downloader, while the
      downloader may still be watching for the storage module, must still end
      cleanly: the daemon exits, and nothing crashes.
    steps:
      - title: "Start the daemon and the downloader, and stop at once"
        run: |
          set -eu

          HOME="$(pwd)/home" ./logosctl/bin/logosctl --config-dir ./session -D --detach
          ./logosctl/bin/logosctl --config-dir ./session call package_downloader start
          # Not a terminal: status prints JSON.
          pid=$(./logosctl/bin/logosctl --config-dir ./session status | jq -r '.daemon.pid // empty')
          if [ -z "$pid" ]; then
            echo "no daemon pid"
            exit 1
          fi

          ./logosctl/bin/logosctl --config-dir ./session stop

          for _ in $(seq 100); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.1
          done

          if kill -0 "$pid" 2>/dev/null; then
            echo "the daemon is still running"
            exit 1
          fi

          # A module host that crashes prints `FATAL: module '<name>' crashed`.
          if grep -E "FATAL: module|terminate called|libc\+\+abi|Segmentation fault|SIGSEGV|SIGABRT" session/logs/daemon.log; then
            exit 1
          fi

          echo "stopped cleanly"
        code_block: |
          HOME=$(pwd)/home logosctl --config-dir ./session -D --detach
          logosctl call package_downloader start
          logosctl stop
        expect_contains:
          - "stopped cleanly"
